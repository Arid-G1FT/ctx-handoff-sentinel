name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: dsh plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: core
        run: node dsh-plugin/test/core.test.mjs
      - name: host
        run: node dsh-plugin/test/host.test.mjs
      - name: client
        run: node dsh-plugin/test/client.test.mjs

  skill:
    name: skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unit tests
        run: python -m unittest discover -s skill/tests -p "test_*.py"
      - name: guard smoke
        run: |
          printf '%s' '{"verdict":"green","constraints":[{"text":"x","source":"user","certain":true}],"files":[],"nextStep":"y","verify":["npm test"],"unknowns":[]}' > /tmp/report.json
          python skill/scripts/guard.py --root . --report /tmp/report.json
